[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobid-competition"
version = "0.1.0"
description = "AuctionNet adaptation for sparse single-slot second-price bidding with historical feedback"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rl = ["numpy>=1.24,<3", "gymnasium==1.0.0", "stable-baselines3==2.5.0", "torch>=2.3,<3"]
upstream = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
autobid = "autobid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
